<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Submission Success</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-[#5B6E91] flex items-center justify-center min-h-screen">

  <div class="bg-white w-[512px] h-[320px] rounded-md shadow-md flex flex-col items-center justify-center text-center p-6">
    <img src="https://cdn-icons-png.flaticon.com/512/9068/9068753.png" alt="Submission Icon" class="w-20 h-20 mb-6"/>

    <h2 class="text-xl font-medium text-gray-900 mb-2">Your application has been successfully submitted!</h2>
    <p class="text-gray-600 mb-6 text-sm">
      You will be notified of your application status via email. Please allow approximately 4 weeks for processing.
    </p>

    <button class="bg-[#2196F3] text-white px-6 py-2 rounded">OK</button>
  </div>

</body>
</html>
