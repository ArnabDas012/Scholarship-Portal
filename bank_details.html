<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bank Details</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-700 min-h-screen">
  <div class="flex">
    <!-- Sidebar -->
    <div class="w-64 bg-white min-h-screen p-4">
      <h2 class="text-lg font-semibold mb-6 text-slate-700">Bank Details</h2>
      <nav class="space-y-2">
        <a id="profileBtn" href="#" class="block px-3 py-2 rounded bg-blue-100 text-blue-700">Profile</a>
        <a id="applicationBtn" href="#" class="block px-3 py-2 rounded hover:bg-gray-100">Application</a>
        <a id="notificationsBtn" href="#" class="block px-3 py-2 rounded hover:bg-gray-100">Notifications</a>
        <a id="supportBtn" href="#" class="block px-3 py-2 rounded hover:bg-gray-100">Help and Support</a>
      </nav>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            document.getElementById('profileBtn').addEventListener('click', () => {
                window.location.href = 'student_dashboard.html';
            });

            document.getElementById('applicationBtn').addEventListener('click', () => {
                window.location.href = 'personal_details.html';
            });

            document.getElementById('notificationsBtn').addEventListener('click', () => {
                window.location.href = 'notification.html';
            });

            document.getElementById('supportBtn').addEventListener('click', () => {
                window.location.href = 'support.html';
            });
        });
    </script>

    <!-- Main Content -->
    <div class="flex-1 p-10 bg-white rounded-tl-2xl shadow-md">
      <h1 class="text-xl font-semibold text-slate-800 mb-1">Bank Details</h1>
      <p class="text-sm text-slate-500 mb-6">
        Efficiently Manage, Monitor, and Optimize Land Resources with Interactive Tools and Insights
      </p>

      <form class="space-y-4 max-w-xl">
        <div>
          <label class="block text-sm font-medium">Bank Name</label>
          <input type="text" placeholder="Bank Name" class="w-full mt-1 border border-gray-300 rounded px-3 py-2" />
        </div>

        <div>
          <label class="block text-sm font-medium">Branch</label>
          <select class="w-full mt-1 border border-gray-300 rounded px-3 py-2">
            <option>Branch</option>
          </select>
        </div>

        <div>
          <label class="block text-sm font-medium">Account Type</label>
          <select class="w-full mt-1 border border-gray-300 rounded px-3 py-2">
            <option>Account Type</option>
          </select>
        </div>

        <div>
          <label class="block text-sm font-medium">IFSC Code</label>
          <select class="w-full mt-1 border border-gray-300 rounded px-3 py-2">
            <option>IFSC Code</option>
          </select>
        </div>

        <div>
          <label class="block text-sm font-medium">Email</label>
          <input type="email" placeholder="Email" class="w-full mt-1 border border-gray-300 rounded px-3 py-2" />
        </div>

        <div>
          <label class="block text-sm font-medium">Bank Address</label>
          <textarea class="w-full mt-1 border border-gray-300 rounded px-3 py-2" placeholder="Address" rows="3"></textarea>
        </div>

        <div class="flex justify-end gap-4 mt-6">
          <button type="button" id="backBtn" class="bg-red-500 text-white px-4 py-2 rounded">Back</button>
            <button type="submit" id="nextBtn" class="bg-blue-500 text-white px-4 py-2 rounded">Next</button>       
            <script>
            document.addEventListener('DOMContentLoaded', function () {
            document.getElementById('backBtn').addEventListener('click', function () {
      // Example: Go to previous page
            window.location.href = 'school_detail.html';
         });

          document.getElementById('nextBtn').addEventListener('click', function (event) {
          event.preventDefault(); // prevent form submission if inside a form

      // Example: Go to next page
          window.location.href = 'upload_doc.html';

      // Or: you can run validation logic before navigating
      // if (formIsValid()) {
      //   window.location.href = 'next_page.html';
      // }
    });
  });
</script>
        </div>
      </form>
    </div>
  </div>
</body>
</html>
