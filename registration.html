<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Student Registration</title>
  <style>
    body {
      background-color: #2f3e53;
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }
    .container {
      background-color: white;
      border-radius: 5px;
      padding: 40px 30px;
      width: 400px;
      box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
    }
    .container h2 {
      margin-top: 0;
      color: #1f2b3a;
    }
    .container p {
      color: #64748b;
      font-size: 14px;
      margin-top: -10px;
    }
    .container h3 {
      text-align: center;
      color: #1f2b3a;
      margin: 30px 0 20px;
    }
    input[type="text"] {
      width: 100%;
      padding: 10px;
      margin: 8px 0;
      border: 1px solid #ddd;
      border-radius: 5px;
      font-size: 16px;
    }
    .btn-small {
      padding: 8px 16px;
      background-color: #2563eb;
      color: white;
      border: none;
      border-radius: 4px;
      margin: 8px 0;
      cursor: pointer;
    }
    .btn-block {
      width: 100%;
      padding: 12px;
      font-size: 16px;
      border: none;
      border-radius: 5px;
      margin-top: 10px;
      cursor: pointer;
    }
    .register-btn {
      background-color: #3b82f6;
      color: white;
    }
    .cancel-btn {
      background-color: #f87171;
      color: white;
    }
  </style>
</head>
<body>
  <div class="container">
    <h2>Student Registration</h2>
    <p>Efficiently Manage, Monitor, and Optimize Land Resources with Interactive Tools and Insights</p>
    
    <h3>Welcome back! Please enter your details.</h3>

    <input type="text" placeholder="Mobile No">
    <button class="btn-small">Get OTP</button>

    <input type="text" placeholder="Enter Otp">
    <button class="btn-small">Verify</button>

    <input type="text" placeholder="Ration Card or Aadhaar No">

<a href="personal_details.html">
  <button class="btn-block register-btn">Register</button>
</a>
<a href="home_page.html">
  <button class="btn-block cancel-btn">Cancel</button>
</a>

  </div>
</body>
</html>
