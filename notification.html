<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Notifications</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-700">

  <div class="flex min-h-screen">
     <!-- Sidebar -->
<div class="w-64 bg-white min-h-screen p-4">
    <h2 class="text-lg font-semibold mb-6 text-slate-700">Notifications</h2>
    <nav class="space-y-2">
      <a href="#" id="profileBtn" class="block px-3 py-2 rounded bg-blue-100 text-blue-700">Profile</a>
      <a href="#" id="applicationBtn" class="block px-3 py-2 rounded hover:bg-gray-100">Application</a>
      <a href="#" id="notificationsBtn" class="block px-3 py-2 rounded hover:bg-gray-100">Notifications</a>
      <a href="#" id="supportBtn" class="block px-3 py-2 rounded hover:bg-gray-100">Help and Support</a>
    </nav>
  </div>
  
  <script>
    document.addEventListener('DOMContentLoaded', function() {
        document.getElementById('profileBtn').addEventListener('click', () => {
            window.location.href = 'student_dashboard.html';
        });

        document.getElementById('applicationBtn').addEventListener('click', () => {
            window.location.href = 'personal_details.html';
        });

        document.getElementById('notificationsBtn').addEventListener('click', () => {
            window.location.href = 'notification.html';
        });

        document.getElementById('supportBtn').addEventListener('click', () => {
            window.location.href = 'support.html';
        });
    });
</script>
    <!-- Main Content -->
    <div class="flex-1 bg-white p-8">
      <!-- Header -->
      <div>
        <h1 class="text-xl font-semibold text-gray-800">Notifications and updates</h1>
        <p class="text-sm text-gray-500">
          Efficiently Manage, Monitor, and Optimize Land Resources with Interactive Tools and Insights
        </p>
      </div>

      <!-- Stats Cards -->
      <div class="grid grid-cols-1 md:grid-cols-3 gap-4 mt-6">
        <div class="bg-white shadow rounded p-4 flex items-center space-x-4 border">
          <div class="text-blue-500 text-3xl">🔔</div>
          <div>
            <p class="text-sm text-gray-500">Total Notifications</p>
            <p class="text-xl font-bold">589</p>
          </div>
        </div>

        <div class="bg-white shadow rounded p-4 flex items-center space-x-4 border">
          <div class="text-blue-500 text-3xl">📥</div>
          <div>
            <p class="text-sm text-gray-500">Unread</p>
            <p class="text-xl font-bold">27</p>
          </div>
        </div>

        <div class="bg-white shadow rounded p-4 flex items-center space-x-4 border">
          <div class="text-blue-500 text-3xl">📅</div>
          <div>
            <p class="text-sm text-gray-500">Last Sent</p>
            <p class="text-xl font-bold">2 Apr 2025</p>
          </div>
        </div>
      </div>

      <!-- Issue Report Form -->
      <div class="mt-8 bg-gray-100 p-6 rounded-lg shadow-inner">
        <h2 class="text-lg font-semibold text-gray-800 mb-4">Report For an Issue</h2>

        <div class="space-y-4">
          <input type="text" placeholder="Issue Title" class="w-full p-3 rounded border border-gray-300 focus:outline-none focus:ring-2 focus:ring-blue-400"/>

          <textarea rows="5" placeholder="Describe your issue" class="w-full p-3 rounded border border-gray-300 focus:outline-none focus:ring-2 focus:ring-blue-400"></textarea>

          <div class="flex items-center space-x-4">
            <label class="bg-white px-4 py-2 rounded border border-gray-300 cursor-pointer hover:bg-gray-50">
              Upload Files
              <input type="file" class="hidden">
            </label>
            <span class="text-gray-500 text-sm">No files selected</span>
          </div>

          <div class="flex justify-end">
            <button class="bg-blue-500 text-white px-6 py-2 rounded hover:bg-blue-600 transition">Send</button>
          </div>
        </div>
      </div>
    </div>
  </div>

</body>
</html>
